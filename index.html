<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Catastral - Pumacoccha Huaro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2c5e3b; --secondary: #3b7b4e; --text-dark: #333; --danger: #d9534f; --success: #28a745; --warning: #ffc107; }
        
        /* NUEVO DISEÑO DE FONDO */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            color: var(--text-dark); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center;
            /* Aquí cargamos la imagen */
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        /* CONTENEDOR CON TRANSPARENCIA ELEGANTE */
        .container { 
            width: 100%; 
            max-width: 500px; 
            /* Fondo blanco al 95% de opacidad para que deje ver un poco el paisaje */
            background: rgba(255, 255, 255, 0.95); 
            /* Efecto de desenfoque tipo cristal */
            backdrop-filter: blur(8px);
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.3); 
        }

        h1 { color: var(--primary); text-align: center; font-size: 22px; margin-top: 0; padding-bottom: 15px; border-bottom: 2px solid #e9ecef; }
        
        .search-type { display: flex; justify-content: space-around; margin-bottom: 20px; background: #e9ecef; padding: 10px; border-radius: 8px; }
        .search-type label { cursor: pointer; font-weight: 600; color: #555; }
        input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 14px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; background: rgba(255,255,255,0.9); }
        button { width: 100%; padding: 14px; background-color: var(--secondary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; }
        button:hover { background-color: var(--primary); }
        
        .loader { display: none; text-align: center; margin-top: 20px; color: var(--secondary); font-weight: bold; }
        .msg-error { text-align: center; color: var(--danger); font-weight: bold; padding: 15px; background: #f8d7da; border-radius: 8px; margin-top: 15px;}
        
        /* Modal y Admin */
        .btn-admin-access { background: transparent; color: #555; padding: 5px; font-size: 13px; text-decoration: underline; width: auto; display: block; margin: 20px auto 0 auto; font-weight: bold;}
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; }
        #adminPanel { display: none; background: rgba(255, 243, 205, 0.9); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #ffc107; }
        #reader { width: 100%; display: none; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); }
        
        /* Diseño de Predios */
        .user-header { background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-top: 25px; margin-bottom: 20px; }
        .user-header h2 { margin: 0 0 5px 0; font-size: 18px; }
        .bocatoma-group { background: rgba(248, 249, 250, 0.9); border: 1px solid #dee2e6; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .bocatoma-header { border-bottom: 2px solid var(--secondary); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .bocatoma-header h3 { margin: 0; font-size: 16px; text-transform: uppercase; }
        .topos-badge { background-color: var(--secondary); color: white; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        
        .predio-card { background: white; border: 1px solid #e0e0e0; border-left: 5px solid var(--primary); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .predio-summary { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .predio-info strong { display: block; color: var(--primary); font-size: 15px; margin-bottom: 3px; }
        .predio-details { display: none; padding: 0 15px 15px 15px; border-top: 1px dashed #eee; }
        
        /* Botones de acción admin */
        .action-btns { display: flex; gap: 5px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;}
        .btn-success { background: var(--success); padding: 10px;} 
        .btn-warning { background: var(--warning); color: #000; padding: 10px;} 
        .btn-danger { background: var(--danger); padding: 10px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Comisión de Regantes<br><small>Sub-Sector Pumacoccha-Huaro</small></h1>

    <div id="adminPanel">
        <h3 id="adminTitle" style="margin-top:0; color: #856404;"></h3>
        <input type="text" id="idEvento" placeholder="ID Evento (Obligatorio para asistencias)" style="display:none; margin-bottom:10px;">
        <div id="adminControls"></div>
        <button style="background: var(--danger); margin-top: 10px;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div id="reader"></div>
    
    <div class="search-type">
        <label><input type="radio" name="searchType" value="dni" checked> DNI</label>
        <label><input type="radio" name="searchType" value="catastro"> Código Catastral</label>
    </div>
    
    <input type="text" id="searchInput" placeholder="Ingrese el DNI del socio...">
    <button onclick="ejecutarBusqueda()">CONSULTAR DATOS</button>

    <div class="loader" id="loader">Conectando con la base de datos...</div>
    <div id="results"></div>

    <button class="btn-admin-access" onclick="document.getElementById('loginModal').style.display = 'flex'">Acceso Administrativo</button>
</div>

<!-- Modal Login -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary); margin-top:0;">Login Administrador</h2>
        <input type="text" id="usuarioInput" placeholder="Usuario">
        <input type="password" id="passwordInput" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Ingresar</button>
        <button class="btn-danger" onclick="document.getElementById('loginModal').style.display='none'">Cancelar</button>
        <p id="loginMsg" style="text-align:center; color:var(--danger);"></p>
    </div>
</div>

<script>
    // 👇 PEGA TU ENLACE NUEVO AQUÍ 👇
    const API_URL = "https://script.google.com/macros/s/AKfycbwEA0dPJHtWupjtp7QihhUhmDiyDrJ5sOCvQNpM__M45YI6slb3sSJCmLSsDCPk-tlB6Q/exec"; 
    
    let rolActual = "PUBLICO";
    let html5QrcodeScanner;
    let datosPadron = null; 

    // Interfaz de Búsqueda
    document.querySelectorAll('input[name="searchType"]').forEach((elem) => {
        elem.addEventListener("change", function(e) {
            const input = document.getElementById("searchInput");
            input.placeholder = e.target.value === "dni" ? "Ingrese el DNI del socio..." : "Ingrese el Código Catastral...";
            input.value = "";
            document.getElementById("results").innerHTML = "";
        });
    });

    // ==================== LÓGICA DE LOGIN ====================
    async function iniciarSesion() {
        const user = document.getElementById("usuarioInput").value;
        const pass = document.getElementById("passwordInput").value;
        document.getElementById("loginMsg").innerText = "Validando...";

        try {
            const response = await fetch(`${API_URL}?action=login&usuario=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
            const data = await response.json();

            if (data.success) {
                rolActual = data.rol;
                document.getElementById("loginModal").style.display = "none";
                activarPanelAdministrativo();
                document.getElementById("usuarioInput").value = "";
                document.getElementById("passwordInput").value = "";
            } else {
                document.getElementById("loginMsg").innerText = data.mensaje;
            }
        } catch (e) {
            document.getElementById("loginMsg").innerText = "Error de conexión con el servidor.";
        }
    }

    function activarPanelAdministrativo() {
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminTitle").innerText = `Rol Activo: ${rolActual}`;
        const controls = document.getElementById("adminControls");
        
        if (rolActual === "TOTAL" || rolActual === "ASISTENCIAS") {
            document.getElementById("idEvento").style.display = "block";
            controls.innerHTML = `<button style="background-color: #17a2b8;" onclick="iniciarEscaner()">📸 Activar Escáner de Cámara</button>`;
        } else if (rolActual === "CONTADOR") {
            controls.innerHTML = "<p>Modo Contador: Busca un predio para registrar pagos.</p>";
        }
    }

    function cerrarSesion() {
        rolActual = "PUBLICO";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("idEvento").style.display = "none";
        if(html5QrcodeScanner) { html5QrcodeScanner.clear(); }
        document.getElementById("reader").style.display = "none";
        document.getElementById("results").innerHTML = "";
    }

    function iniciarEscaner() {
        document.getElementById("reader").style.display = "block";
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: {width: 250, height: 250} },
            (decodedText) => {
                html5QrcodeScanner.stop();
                document.getElementById("reader").style.display = "none";
                document.getElementById("searchInput").value = decodedText;
                document.querySelector('input[value="catastro"]').checked = true;
                ejecutarBusqueda();
            }
        ).catch(err => alert("Error al iniciar cámara: " + err));
    }

    // ==================== BÚSQUEDA Y RENDERIZADO ====================
    async function ejecutarBusqueda() {
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const query = document.getElementById("searchInput").value.trim().toUpperCase();
        const resultsDiv = document.getElementById("results");
        const loader = document.getElementById("loader");

        if (!query) return;

        resultsDiv.innerHTML = "";
        loader.style.display = "block";

        try {
            if (!datosPadron) {
                const req = await fetch(`${API_URL}?action=consulta`);
                datosPadron = await req.json();
            }
            loader.style.display = "none";

            const socios = datosPadron.socios;
            const predios = datosPadron.predios;

            if (type === "dni") {
                const socio = socios.find(s => s.DNI.toString() === query);
                if (socio) {
                    const prediosSocio = predios.filter(p => p.DNI_Socio.toString() === query);
                    mostrarResultadosAgrupados(socio, prediosSocio);
                } else {
                    resultsDiv.innerHTML = "<div class='msg-error'>Socio no encontrado en el padrón.</div>";
                }
            } else {
                const predio = predios.find(p => p.Código && p.Código.toString().toUpperCase() === query);
                if (predio) {
                    const socio = socios.find(s => s.DNI.toString() === predio.DNI_Socio.toString());
                    mostrarResultadosAgrupados(socio || {Nombre: "Desconocido", DNI: predio.DNI_Socio}, [predio]);
                } else {
                    resultsDiv.innerHTML = "<div class='msg-error'>Código catastral no registrado.</div>";
                }
            }
        } catch (error) {
            loader.style.display = "none";
            resultsDiv.innerHTML = "<div class='msg-error'>Error de red al consultar el padrón.</div>";
        }
    }

    function mostrarResultadosAgrupados(socio, prediosArray) {
        const resultsDiv = document.getElementById("results");
        let html = `<div class="user-header"><h2>Socio: ${socio.Nombre}</h2><p>DNI: ${socio.DNI}</p></div>`;

        if(prediosArray.length === 0) {
            resultsDiv.innerHTML = html + `<p style="text-align:center;">No hay terrenos registrados.</p>`;
            return;
        }

        const gruposBocatoma = {};
        prediosArray.forEach(p => {
            const bocatoma = p.Bocatoma || 'Sin Bocatoma';
            if (!gruposBocatoma[bocatoma]) gruposBocatoma[bocatoma] = [];
            gruposBocatoma[bocatoma].push(p);
        });

        for (const [bocatoma, prediosDelGrupo] of Object.entries(gruposBocatoma)) {
            let sumaArea = 0;
            prediosDelGrupo.forEach(p => { sumaArea += parseFloat(p.Área) || 0; });
            const totalTopos = (sumaArea / 0.33).toFixed(2);

            html += `
            <div class="bocatoma-group">
                <div class="bocatoma-header">
                    <h3>📍 ${bocatoma}</h3>
                    <span class="topos-badge">${totalTopos} Topos</span>
                </div>`;

            prediosDelGrupo.forEach((p, index) => {
                const accordionId = 'panel-' + bocatoma.replace(/\s+/g, '') + '-' + index;
                const deudas = Number(p.Deudas) || 0;
                
                html += `
                <div class="predio-card" id="card-${accordionId}">
                    <div class="predio-summary" onclick="toggleAcordeon('${accordionId}')">
                        <div class="predio-info">
                            <strong>Código: ${p.Código}</strong>
                            <span>Área: ${p.Área || 0} Ha</span>
                        </div>
                        <div>▼</div>
                    </div>
                    
                    <div class="predio-details" id="${accordionId}">
                        <p><strong>Asistencias:</strong> ${p.Asistencias || 0}</p>
                        <p><strong>Faltas:</strong> ${p.Faltas || 0}</p>
                        <p><strong>Deuda:</strong> S/ ${deudas.toFixed(2)}</p>`;
                
                if (rolActual === "TOTAL" || rolActual === "ASISTENCIAS") {
                    html += `
                        <div class="action-btns">
                            <button class="btn-success" onclick="registrarAsistencia('${p.Código}', '${socio.DNI}', 'Asistió')">Asistió</button>
                            <button class="btn-warning" onclick="registrarAsistencia('${p.Código}', '${socio.DNI}', 'Tarde')">Tarde</button>
                            <button class="btn-danger" onclick="registrarAsistencia('${p.Código}', '${socio.DNI}', 'Falta')">Falta</button>
                        </div>`;
                }
                
                if (rolActual === "TOTAL" || rolActual === "CONTADOR") {
                    html += `
                        <div style="margin-top:15px; padding-top:10px; border-top: 1px solid #ccc;">
                            <input type="number" id="monto-${p.Código}" placeholder="Monto (S/)" style="width: 48%; display: inline-block;">
                            <button style="width: 48%; display: inline-block; background: #007bff;" onclick="registrarPago('${p.Código}', '${socio.DNI}')">Guardar Pago</button>
                        </div>`;
                }

                html += `</div></div>`; 
            });
            html += `</div>`; 
        }
        resultsDiv.innerHTML = html;
    }

    function toggleAcordeon(id) {
        const panel = document.getElementById(id);
        panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    // ==================== ACCIONES DE ESCRITURA EN EXCEL ====================
    async function registrarAsistencia(catastro, dni, estado) {
        const idEvento = document.getElementById("idEvento").value;
        if (!idEvento) return alert("ATENCIÓN: Debes ingresar el ID del Evento (Ej: EV-001) en el panel de administrador.");
        
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "registrar_asistencia", id_evento: idEvento, dni: dni, catastro: catastro, estado: estado })
        });
        alert(`Guardado: El terreno ${catastro} registra "${estado}".`);
    }

    async function registrarPago(catastro, dni) {
        const monto = document.getElementById(`monto-${catastro}`).value;
        if (!monto) return alert("Ingrese un monto válido.");
        
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "registrar_pago", catastro: catastro, dni: dni, monto: monto, concepto: "Pago General" })
        });
        alert(`Guardado: Pago de S/ ${monto} registrado para el terreno ${catastro}.`);
        document.getElementById(`monto-${catastro}`).value = "";
    }
</script>
</body>
</html>
