<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Catastral - Pumacoccha Huaro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2c5e3b; --secondary: #3b7b4e; --text-dark: #333; --danger: #d9534f; --success: #28a745; --warning: #ffc107; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-dark); margin: 0; padding: 20px; display: flex; justify-content: center; background-image: url('fondo.jpeg'); background-size: cover; background-position: center; background-attachment: fixed; }
        .container { width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); padding: 30px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
        h1 { color: var(--primary); text-align: center; font-size: 22px; margin-top: 0; padding-bottom: 15px; border-bottom: 2px solid #e9ecef; }
        .search-type { display: flex; justify-content: space-around; margin-bottom: 20px; background: #e9ecef; padding: 10px; border-radius: 8px; }
        input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 14px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; background: rgba(255,255,255,0.9); }
        button { width: 100%; padding: 14px; background-color: var(--secondary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; }
        .loader { display: none; text-align: center; margin-top: 20px; color: var(--secondary); font-weight: bold; }
        .msg-error { text-align: center; color: var(--danger); font-weight: bold; padding: 15px; background: #f8d7da; border-radius: 8px; margin-top: 15px;}
        .msg-success { text-align: center; color: white; font-weight: bold; padding: 25px; background: var(--success); border-radius: 8px; margin-top: 15px; font-size: 18px;}
        .btn-admin-access { background: transparent; color: #555; padding: 5px; font-size: 13px; text-decoration: underline; width: auto; display: block; margin: 20px auto 0 auto; font-weight: bold;}
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; }
        #adminPanel { display: none; background: rgba(255, 243, 205, 0.9); padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #ffc107; }
        #eventContainer { display:none; background: rgba(255,255,255,0.8); padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; }
        #reader { width: 100%; display: none; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); }
        .user-header { background: var(--primary); color: white; padding: 15px; border-radius: 8px; margin-top: 25px; margin-bottom: 20px; }
        .bocatoma-group { background: rgba(248, 249, 250, 0.9); border: 1px solid #dee2e6; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .bocatoma-header { border-bottom: 2px solid var(--secondary); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .topos-badge { background-color: var(--secondary); color: white; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .predio-card { background: white; border: 1px solid #e0e0e0; border-left: 5px solid var(--primary); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .predio-summary { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .predio-details { display: none; padding: 0 15px 15px 15px; border-top: 1px dashed #eee; }
        .action-btns { display: flex; gap: 5px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;}
        
        /* Tabla de historial de eventos */
        .historial-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .historial-table th, .historial-table td { padding: 8px 5px; text-align: left; border-bottom: 1px solid #eee; }
        .historial-table th { background: #f0f0f0; color: #555; }
        
        /* Filtros Bocatoma */
        .filtro-container { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-top: 10px; font-size: 14px; }
        .filtro-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Comisión de Regantes<br><small>Sub-Sector Pumacoccha-Huaro</small></h1>

    <!-- PANEL DE ADMINISTRADOR -->
    <div id="adminPanel">
        <h3 id="adminTitle" style="margin-top:0; color: #856404;"></h3>
        
        <div id="eventContainer">
            <label style="font-weight:bold; color:var(--primary); font-size: 14px;">1. ID del Evento (Debe existir en hoja Eventos)</label>
            <div style="display: flex; gap: 10px; margin-top: 5px; margin-bottom: 10px;">
                <input type="text" id="idEvento" placeholder="Ej: EV-001" onkeyup="guardarEvento()" style="margin:0; flex: 1;">
                <button onclick="finalizarEvento()" style="background:var(--danger); margin:0; width:auto; padding: 0 15px;">Finalizar</button>
            </div>
            
            <!-- NUEVO: FILTRO DE BOCATOMAS PARA FAENAS -->
            <div class="filtro-container">
                <strong>2. ¿Para qué bocatoma es la faena?</strong><br>
                <small style="color:#666;">Selecciona las bocatomas afectadas. Si es asamblea general, déjalo vacío.</small>
                <div class="filtro-grid" id="listaFiltros">
                    <!-- Se llena automáticamente con Javascript -->
                    <i>Cargando padrón...</i>
                </div>
            </div>
            
            <label style="font-weight:bold; color:var(--primary); font-size: 14px; margin-top:15px; display:block;">3. Control de Cámara (Ráfaga Inteligente)</label>
            <div style="display: flex; gap: 10px; margin-top:5px;">
                <button id="btnStartCam" style="background-color: #17a2b8; margin:0;" onclick="iniciarEscaner()">📷 Iniciar Escáner</button>
                <button id="btnStopCam" style="background-color: #6c757d; margin:0; display:none;" onclick="detenerEscaner()">⏹ Pausar Cámara</button>
            </div>
        </div>

        <div id="adminControls"></div>
        <button style="background: #333; margin-top: 10px;" onclick="cerrarSesion()">Cerrar Sesión Segura</button>
    </div>

    <div id="reader"></div>
    
    <div class="search-type">
        <label><input type="radio" name="searchType" value="dni" checked> DNI</label>
        <label><input type="radio" name="searchType" value="catastro"> Código Catastral</label>
    </div>
    
    <input type="text" id="searchInput" placeholder="Ingrese el DNI del socio...">
    <button onclick="ejecutarBusqueda()">CONSULTAR PADRÓN</button>

    <div class="loader" id="loader">Conectando con la base de datos...</div>
    <div id="results"></div>

    <button class="btn-admin-access" onclick="document.getElementById('loginModal').style.display = 'flex'">Acceso Administrativo</button>
</div>

<!-- Modal Login -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary); margin-top:0;">Login Administrador</h2>
        <input type="text" id="usuarioInput" placeholder="Usuario">
        <input type="password" id="passwordInput" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Ingresar</button>
        <button style="background:var(--danger);" onclick="document.getElementById('loginModal').style.display='none'">Cancelar</button>
        <p id="loginMsg" style="text-align:center; color:var(--danger);"></p>
    </div>
</div>

<script>
    // 👇 PEGA TU ENLACE NUEVO AQUÍ 👇
    const API_URL = "https://script.google.com/macros/s/AKfycbxV6CfUlxF_ygT1oKXpTPcz8UoBmEyyrTiX2bNfH02cL54UuQdXIO0YHZvXdoci-mEc/exec"; 
    
    let rolActual = "PUBLICO";
    let html5QrcodeScanner = null;
    let datosPadron = null; 
    let timeoutCamara; 

    // ======== PERSISTENCIA Y CIERRE DE EVENTO ========
    function guardarEvento() {
        localStorage.setItem("evento_Pumacoccha", document.getElementById("idEvento").value.trim().toUpperCase());
    }
    
    function cargarEvento() {
        const guardado = localStorage.getItem("evento_Pumacoccha");
        if(guardado) document.getElementById("idEvento").value = guardado;
    }

    function finalizarEvento() {
        if(confirm("¿Seguro que deseas FINALIZAR el evento? Esto limpiará la memoria anti-duplicados del equipo.")) {
            let id = document.getElementById("idEvento").value.trim().toUpperCase();
            localStorage.removeItem("evento_Pumacoccha");
            localStorage.removeItem("asistio_" + id);
            document.getElementById("idEvento").value = "";
            document.getElementById("results").innerHTML = "<div class='msg-success' style='background:#333;'>Evento finalizado. Equipo listo para próxima fecha.</div>";
            detenerEscaner();
        }
    }

    // ======== DESCARGA DE DATOS Y FILTROS ========
    async function asegurarPadron() {
        if (!datosPadron) {
            document.getElementById("loader").style.display = "block";
            const req = await fetch(`${API_URL}?action=consulta`);
            datosPadron = await req.json();
            document.getElementById("loader").style.display = "none";
            generarFiltrosBocatoma();
        }
    }

    // NUEVO: Genera los checkboxes leyendo las bocatomas de la BD
    function generarFiltrosBocatoma() {
        if (!datosPadron || !datosPadron.predios) return;
        const listaBocatomas = [...new Set(datosPadron.predios.map(p => p.Bocatoma).filter(b => b))].sort();
        let html = "";
        listaBocatomas.forEach(b => {
            html += `<label><input type="checkbox" class="chk-bocatoma" value="${b}"> ${b}</label>`;
        });
        document.getElementById("listaFiltros").innerHTML = html;
    }

    // ======== LOGIN ========
    async function iniciarSesion() {
        const user = document.getElementById("usuarioInput").value;
        const pass = document.getElementById("passwordInput").value;
        document.getElementById("loginMsg").innerText = "Validando...";

        try {
            const response = await fetch(`${API_URL}?action=login&usuario=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
            const data = await response.json();

            if (data.success) {
                rolActual = data.rol;
                document.getElementById("loginModal").style.display = "none";
                await asegurarPadron(); // Descargar base al loguear
                activarPanelAdministrativo();
                document.getElementById("usuarioInput").value = "";
                document.getElementById("passwordInput").value = "";
            } else { document.getElementById("loginMsg").innerText = data.mensaje; }
        } catch (e) { document.getElementById("loginMsg").innerText = "Error de conexión."; }
    }

    function activarPanelAdministrativo() {
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminTitle").innerText = `Rol Activo: ${rolActual}`;
        const controls = document.getElementById("adminControls");
        
        if (rolActual === "TOTAL" || rolActual === "ASISTENCIAS") {
            document.getElementById("eventContainer").style.display = "block";
            cargarEvento();
            controls.innerHTML = "";
        } else if (rolActual === "CONTADOR") {
            document.getElementById("eventContainer").style.display = "none";
            controls.innerHTML = "<p>Modo Contador: Usa la búsqueda para registrar pagos.</p>";
        }
    }

    function cerrarSesion() {
        rolActual = "PUBLICO";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("eventContainer").style.display = "none";
        detenerEscaner();
        document.getElementById("results").innerHTML = "";
    }

    // ======== CONTROL DE CÁMARA ========
    function actualizarBotonesCamara(encendida) {
        if(encendida) {
            document.getElementById("reader").style.display = "block";
            document.getElementById("btnStartCam").style.display = "none";
            document.getElementById("btnStopCam").style.display = "block";
        } else {
            document.getElementById("reader").style.display = "none";
            document.getElementById("btnStartCam").style.display = "block";
            document.getElementById("btnStartCam").innerHTML = "▶ Continuar Cámara";
            document.getElementById("btnStopCam").style.display = "none";
        }
    }

    function iniciarEscaner() {
        clearTimeout(timeoutCamara);
        actualizarBotonesCamara(true);
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: {width: 250, height: 250} },
            async (decodedText) => {
                detenerEscaner();
                const escaneo = decodedText.trim();
                document.getElementById("searchInput").value = escaneo;

                if(escaneo.length === 8 && !isNaN(escaneo)) {
                    document.querySelector('input[value="dni"]').checked = true;
                    if (rolActual === "TOTAL" || rolActual === "ASISTENCIAS") {
                        await asegurarPadron();
                        procesarRafa(escaneo);
                        return;
                    }
                } else {
                    document.querySelector('input[value="catastro"]').checked = true;
                }
                ejecutarBusqueda();
            }
        ).catch(err => { alert("Error de cámara: " + err); actualizarBotonesCamara(false); });
    }

    function detenerEscaner() {
        if(html5QrcodeScanner) {
            try { html5QrcodeScanner.stop().then(() => { html5QrcodeScanner.clear(); actualizarBotonesCamara(false); }).catch(e => { html5QrcodeScanner.clear(); actualizarBotonesCamara(false); }); } 
            catch (e) { actualizarBotonesCamara(false); }
        }
    }

    // ======== MODO RÁFAGA + FILTRO DE BOCATOMA ========
    async function procesarRafa(dni) {
        const idEvento = document.getElementById("idEvento").value.trim().toUpperCase();
        if (!idEvento) {
            alert("ALERTA: Ingresa el ID del Evento antes de escanear.");
            return;
        }

        let claveMemoria = "asistio_" + idEvento;
        let registrados = JSON.parse(localStorage.getItem(claveMemoria)) || [];
        
        if (registrados.includes(dni)) {
            document.getElementById("results").innerHTML = `<div class='msg-error' style='font-size:20px; padding:30px;'>⚠️ ¡ALTO! Este DNI (${dni}) YA REGISTRÓ su asistencia.<br><small>Cámara reanudando...</small></div>`;
            timeoutCamara = setTimeout(() => { iniciarEscaner(); }, 3000);
            return;
        }

        const socio = datosPadron.socios.find(s => s.DNI.toString() === dni);
        if(!socio) {
            document.getElementById("results").innerHTML = "<div class='msg-error'>Socio no encontrado.</div>";
            timeoutCamara = setTimeout(() => { iniciarEscaner(); }, 2500); return;
        }

        const prediosSocio = datosPadron.predios.filter(p => p.DNI_Socio.toString() === dni);
        
        // APLICAR FILTRO DE BOCATOMA
        const filtrosSeleccionados = Array.from(document.querySelectorAll('.chk-bocatoma:checked')).map(cb => cb.value);
        let prediosAfectados = prediosSocio;
        
        if (filtrosSeleccionados.length > 0) {
            prediosAfectados = prediosSocio.filter(p => filtrosSeleccionados.includes(p.Bocatoma));
        }

        if(prediosAfectados.length === 0) {
            document.getElementById("results").innerHTML = `<div class='msg-error'>Socio ${socio.Nombre} NO tiene predios en la bocatoma seleccionada para esta faena.</div>`;
            timeoutCamara = setTimeout(() => { iniciarEscaner(); }, 3000); return;
        }

        document.getElementById("results").innerHTML = `<div class="loader" style="display:block;">Sincronizando ${prediosAfectados.length} predios...</div>`;

        const promesasEnvio = prediosAfectados.map(p => {
            return fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "registrar_asistencia", id_evento: idEvento, dni: dni, catastro: p.Código, estado: "Asistió" })
            });
        });
        await Promise.all(promesasEnvio);

        registrados.push(dni);
        localStorage.setItem(claveMemoria, JSON.stringify(registrados));

        document.getElementById("results").innerHTML = `
            <div class='msg-success'>
                ✅ ¡ASISTENCIA EXITOSA!<br><span style="font-size: 16px;">Socio: ${socio.Nombre}</span><br>
                <span style="font-size: 14px;">(${prediosAfectados.length} predios en las bocatomas de la faena)</span><br><br>
                <small style="font-weight:normal;">Siguiente socio en 2 segundos...</small>
            </div>`;
        timeoutCamara = setTimeout(() => { iniciarEscaner(); }, 2000);
    }

    // ======== BÚSQUEDA Y RENDERIZADO (CON HISTORIAL DE EVENTOS) ========
    async function ejecutarBusqueda() {
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const query = document.getElementById("searchInput").value.trim().toUpperCase();
        const resultsDiv = document.getElementById("results");
        
        if (!query) return;
        resultsDiv.innerHTML = "";
        await asegurarPadron();

        const socios = datosPadron.socios;
        const predios = datosPadron.predios;

        if (type === "dni") {
            const socio = socios.find(s => s.DNI.toString() === query);
            if (socio) mostrarResultadosAgrupados(socio, predios.filter(p => p.DNI_Socio.toString() === query));
            else resultsDiv.innerHTML = "<div class='msg-error'>Socio no encontrado.</div>";
        } else {
            const predio = predios.find(p => p.Código && p.Código.toString().toUpperCase() === query);
            if (predio) mostrarResultadosAgrupados(socios.find(s => s.DNI.toString() === predio.DNI_Socio.toString()) || {Nombre: "Desconocido", DNI: predio.DNI_Socio}, [predio]);
            else resultsDiv.innerHTML = "<div class='msg-error'>Código catastral no registrado.</div>";
        }
    }

    function formatearFecha(fechaCadena) {
        if(!fechaCadena) return "--/--/----";
        const d = new Date(fechaCadena);
        return isNaN(d) ? fechaCadena : d.toLocaleDateString('es-PE');
    }

    function mostrarResultadosAgrupados(socio, prediosArray) {
        const resultsDiv = document.getElementById("results");
        let html = `<div class="user-header"><h2>Socio: ${socio.Nombre}</h2><p>DNI: ${socio.DNI}</p></div>`;

        if(prediosArray.length === 0) {
            resultsDiv.innerHTML = html + `<p style="text-align:center; background: rgba(255,255,255,0.8); padding:10px; border-radius:8px;">No hay terrenos registrados.</p>`; return;
        }

        const gruposBocatoma = {};
        prediosArray.forEach(p => {
            const bocatoma = p.Bocatoma || 'Sin Bocatoma';
            if (!gruposBocatoma[bocatoma]) gruposBocatoma[bocatoma] = [];
            gruposBocatoma[bocatoma].push(p);
        });

        for (const [bocatoma, prediosDelGrupo] of Object.entries(gruposBocatoma)) {
            let sumaArea = 0;
            prediosDelGrupo.forEach(p => { sumaArea += parseFloat(p.Área) || 0; });
            html += `<div class="bocatoma-group"><div class="bocatoma-header"><h3>📍 ${bocatoma}</h3><span class="topos-badge">${(sumaArea / 0.33).toFixed(2)} Topos</span></div>`;

            prediosDelGrupo.forEach((p, index) => {
                const accordionId = 'panel-' + bocatoma.replace(/\s+/g, '') + '-' + index;
                const deudas = Number(p.Deudas) || 0;
                
                // GENERAR HISTORIAL DE EVENTOS PARA ESTE PREDIO
                const misAsistencias = (datosPadron.asistencias || []).filter(a => a.Catastro === p.Código);
                let historialHTML = "";
                if(misAsistencias.length > 0) {
                    historialHTML = `<table class="historial-table"><tr><th>Fecha</th><th>Evento</th><th>Estado</th></tr>`;
                    misAsistencias.forEach(a => {
                        const evtInfo = (datosPadron.eventos || []).find(e => e.ID_Evento === a.ID_Evento) || {Fecha: "", Tipo: "Sin Datos", Descripción: a.ID_Evento};
                        let colorSt = a.Estado === "Falta" ? "color:red;" : (a.Estado === "Tarde" ? "color:orange;" : "color:green;");
                        historialHTML += `<tr>
                            <td>${formatearFecha(evtInfo.Fecha)}</td>
                            <td><strong>${evtInfo.Tipo}</strong><br><small style="color:#777;">${evtInfo.Descripción}</small></td>
                            <td style="font-weight:bold; ${colorSt}">${a.Estado}</td>
                        </tr>`;
                    });
                    historialHTML += `</table>`;
                } else {
                    historialHTML = `<p style="font-size:13px; color:#777;">No hay registros de asistencia para este terreno.</p>`;
                }
                
                html += `
                <div class="predio-card" id="card-${accordionId}">
                    <div class="predio-summary" onclick="toggleAcordeon('${accordionId}')">
                        <div class="predio-info"><strong>Código: ${p.Código}</strong><span>Área: ${p.Área || 0} Ha</span></div><div>▼</div>
                    </div>
                    <div class="predio-details" id="${accordionId}">
                        <h4 style="margin: 15px 0 5px 0; border-bottom:1px solid #ccc; padding-bottom:5px;">📋 Historial de Eventos</h4>
                        ${historialHTML}
                        <h4 style="margin: 15px 0 5px 0; border-bottom:1px solid #ccc; padding-bottom:5px;">💰 Estado Financiero</h4>
                        <p style="margin:5px 0;"><strong>Deuda Pendiente:</strong> S/ ${deudas.toFixed(2)}</p>`;
                
                if (rolActual === "TOTAL" || rolActual === "CONTADOR") {
                    html += `
                        <div style="margin-top:10px;">
                            <input type="number" id="monto-${p.Código}" placeholder="Monto (S/)" style="width: 48%; display: inline-block;">
                            <button style="width: 48%; display: inline-block; background: #007bff; padding:10px;" onclick="registrarPago('${p.Código}', '${socio.DNI}')">Abonar</button>
                        </div>`;
                }
                html += `</div></div>`; 
            });
            html += `</div>`; 
        }
        resultsDiv.innerHTML = html;
    }

    function toggleAcordeon(id) {
        const panel = document.getElementById(id);
        panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    async function registrarPago(catastro, dni) {
        const monto = document.getElementById(`monto-${catastro}`).value;
        if (!monto) return alert("Ingrese un monto.");
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "registrar_pago", catastro: catastro, dni: dni, monto: monto, concepto: "Pago General" }) });
        alert(`Abono de S/ ${monto} guardado exitosamente.`);
        document.getElementById(`monto-${catastro}`).value = "";
    }
</script>
</body>
</html>
