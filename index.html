<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Regantes - Pumacoccha-Huaro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c5e3b; text-align: center; font-size: 24px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        .search-box { margin-top: 20px; }
        .radio-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3b7b4e; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.3s; }
        button:hover { background-color: #2c5e3b; }
        #results { margin-top: 25px; display: none; }
        .card { border: 1px solid #e0e0e0; border-left: 5px solid #3b7b4e; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #fafafa; }
        .card h3 { margin: 0 0 10px 0; color: #2c5e3b; }
        .card p { margin: 5px 0; font-size: 14px; }
        .alert { color: #d9534f; font-weight: bold; }
        .success { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Comisión de Regantes<br>Sub-Sector Pumacoccha-Huaro</h1>
    
    <div class="search-box">
        <div class="radio-group">
            <label><input type="radio" name="searchType" value="dni" checked> Buscar por DNI</label>
            <label><input type="radio" name="searchType" value="catastro"> Buscar por Catastro</label>
        </div>
        <input type="text" id="searchInput" placeholder="Ingrese el DNI (Ej: 12345678)">
        <button onclick="buscarDatos()">CONSULTAR DATOS</button>
    </div>

    <div id="results"></div>
</div>

<script>
    // Base de datos de prueba (Simulación del backend)
    const db = {
        socios: {
            "12345678": { nombre: "JUAN PÉREZ GARCÍA", predios: ["PC-1001", "PC-1002"] },
            "87654321": { nombre: "MARÍA QUISPE CONDORI", predios: ["PC-2005"] }
        },
        predios: {
            "PC-1001": { area: "2.5 Ha", bocatoma: "Canal Principal", deudas: 0, faltas: 0, asistencias: "10/10 (100%)" },
            "PC-1002": { area: "1.0 Ha", bocatoma: "Canal Secundario B", deudas: 50, faltas: 1, asistencias: "9/10 (90%)" },
            "PC-2005": { area: "3.2 Ha", bocatoma: "Canal Principal", deudas: 120, faltas: 2, asistencias: "8/10 (80%)" }
        }
    };

    // Lógica para cambiar el placeholder según la selección
    document.querySelectorAll('input[name="searchType"]').forEach((elem) => {
        elem.addEventListener("change", function(event) {
            const input = document.getElementById("searchInput");
            if(event.target.value === "dni") {
                input.placeholder = "Ingrese el DNI (Ej: 12345678)";
            } else {
                input.placeholder = "Ingrese el Código Catastral (Ej: PC-1001)";
            }
        });
    });

    // Función principal de búsqueda
    function buscarDatos() {
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const query = document.getElementById("searchInput").value.trim().toUpperCase();
        const resultsDiv = document.getElementById("results");
        resultsDiv.style.display = "block";
        resultsDiv.innerHTML = ""; // Limpiar resultados anteriores

        if (!query) {
            resultsDiv.innerHTML = "<p class='alert'>Por favor, ingrese un valor para buscar.</p>";
            return;
        }

        if (type === "dni") {
            const socio = db.socios[query];
            if (socio) {
                let html = `<h2>Socio: ${socio.nombre}</h2>`;
                html += `<p><strong>DNI:</strong> ${query}</p>`;
                html += `<h3>Predios Registrados (${socio.predios.length}):</h3>`;
                
                socio.predios.forEach(idPredio => {
                    const datos = db.predios[idPredio];
                    html += buildPredioCard(idPredio, datos);
                });
                resultsDiv.innerHTML = html;
            } else {
                resultsDiv.innerHTML = "<p class='alert'>No se encontró ningún socio con ese DNI.</p>";
            }
        } else {
            const predio = db.predios[query];
            if (predio) {
                resultsDiv.innerHTML = `<h2>Detalle del Predio</h2>` + buildPredioCard(query, predio);
            } else {
                resultsDiv.innerHTML = "<p class='alert'>No se encontró ningún predio con ese código.</p>";
            }
        }
    }

    // Constructor de tarjetas de información
    function buildPredioCard(id, datos) {
        const estadoDeuda = datos.deudas > 0 ? `<span class="alert">S/ ${datos.deudas}.00 (Deuda Pendiente)</span>` : `<span class="success">Al día (S/ 0.00)</span>`;
        const estadoFaltas = datos.faltas > 0 ? `<span class="alert">${datos.faltas} falta(s) registrada(s)</span>` : `<span class="success">Sin faltas</span>`;
        
        return `
            <div class="card">
                <h3>CÓDIGO: ${id}</h3>
                <p><strong>Bocatoma:</strong> ${datos.bocatoma}</p>
                <p><strong>Área:</strong> ${datos.area}</p>
                <p><strong>Pagos/Deudas:</strong> ${estadoDeuda}</p>
                <p><strong>Faltas/Multas:</strong> ${estadoFaltas}</p>
                <p><strong>Asistencias (Asambleas/Faenas):</strong> ${datos.asistencias}</p>
            </div>
        `;
    }
</script>

</body>
</html>
