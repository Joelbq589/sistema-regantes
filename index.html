<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Catastral - Pumacoccha Huaro</title>
    <style>
        :root {
            --primary: #2c5e3b;
            --secondary: #3b7b4e;
            --bg-color: #f0f4f1;
            --text-dark: #333;
            --card-bg: #ffffff;
            --danger: #d9534f;
            --success: #28a745;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            font-size: 22px;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .search-type {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
        }

        .search-type label {
            cursor: pointer;
            font-weight: 600;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(59, 123, 78, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--primary);
            transform: translateY(-1px);
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: var(--secondary);
            font-weight: bold;
        }

        #results { margin-top: 25px; }

        .user-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .user-header h2 { margin: 0 0 5px 0; font-size: 18px; }
        .user-header p { margin: 0; opacity: 0.9; }

        .predio-card {
            border: 1px solid #e9ecef;
            border-left: 5px solid var(--secondary);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .predio-card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 16px; }
        .predio-card p { margin: 6px 0; font-size: 14px; display: flex; justify-content: space-between; border-bottom: 1px dashed #ddd; padding-bottom: 4px; }
        .predio-card p:last-child { border-bottom: none; }
        
        .badge { padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
        .badge.alert { background: #f8d7da; color: var(--danger); }
        .badge.success { background: #d4edda; color: var(--success); }
        .msg-error { text-align: center; color: var(--danger); font-weight: bold; padding: 15px; background: #f8d7da; border-radius: 8px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Comisión de Regantes<br><small>Sub-Sector Pumacoccha-Huaro</small></h1>
    
    <div class="search-type">
        <label><input type="radio" name="searchType" value="dni" checked> DNI</label>
        <label><input type="radio" name="searchType" value="catastro"> Código Catastral</label>
    </div>
    
    <input type="text" id="searchInput" placeholder="Ingrese el DNI del socio...">
    <button onclick="ejecutarBusqueda()">CONSULTAR DATOS</button>

    <div class="loader" id="loader">Conectando con la base de datos...</div>
    <div id="results"></div>
</div>

<script>
    // TU ENLACE OFICIAL
    const API_URL = "https://script.google.com/macros/s/AKfycbyaz1PJ7zcZrRrOx-vcToRoJwwQes4OZ-57PQb_P4qytYs1_4qL2JVU7-J8KBEAT47pMw/exec";

    // Cambiar texto de ayuda según selección
    document.querySelectorAll('input[name="searchType"]').forEach((elem) => {
        elem.addEventListener("change", function(e) {
            const input = document.getElementById("searchInput");
            input.placeholder = e.target.value === "dni" ? "Ingrese el DNI del socio..." : "Ingrese el Código Catastral (Ej: P-001)...";
            input.value = "";
            document.getElementById("results").innerHTML = "";
        });
    });

    async function ejecutarBusqueda() {
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const query = document.getElementById("searchInput").value.trim().toUpperCase();
        const resultsDiv = document.getElementById("results");
        const loader = document.getElementById("loader");

        if (!query) {
            resultsDiv.innerHTML = "<div class='msg-error'>Por favor, ingrese un dato válido.</div>";
            return;
        }

        resultsDiv.innerHTML = "";
        loader.style.display = "block";

        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            loader.style.display = "none";

            const socios = data.socios;
            const predios = data.predios;

            if (type === "dni") {
                // Buscar por DNI
                const socio = socios.find(s => s.DNI.toString() === query);
                if (socio) {
                    const prediosSocio = predios.filter(p => p.DNI_Socio.toString() === query);
                    mostrarResultadosSocio(socio, prediosSocio);
                } else {
                    resultsDiv.innerHTML = "<div class='msg-error'>Socio no encontrado en el padrón.</div>";
                }
            } else {
                // Buscar por Código de Predio
                const predio = predios.find(p => p.Código && p.Código.toString().toUpperCase() === query);
                if (predio) {
                    const socio = socios.find(s => s.DNI.toString() === predio.DNI_Socio.toString());
                    mostrarResultadosSocio(socio || {Nombre: "Desconocido", DNI: predio.DNI_Socio}, [predio]);
                } else {
                    resultsDiv.innerHTML = "<div class='msg-error'>Código catastral no registrado.</div>";
                }
            }
        } catch (error) {
            loader.style.display = "none";
            resultsDiv.innerHTML = "<div class='msg-error'>Error de conexión. Revise su internet o la URL del script.</div>";
        }
    }

    function mostrarResultadosSocio(socio, prediosArray) {
        const resultsDiv = document.getElementById("results");
        
        let html = `
            <div class="user-header">
                <h2>Socio: ${socio.Nombre}</h2>
                <p>DNI: ${socio.DNI}</p>
            </div>
            <h3 style="color:#555; font-size: 15px; margin-bottom: 10px;">PREDIOS ASIGNADOS (${prediosArray.length})</h3>
        `;

        if(prediosArray.length === 0) {
            html += `<p style="color:#666;">No hay predios registrados a este DNI.</p>`;
        } else {
            prediosArray.forEach(p => {
                const deudas = Number(p.Deudas) || 0;
                const faltas = Number(p.Faltas) || 0;
                
                const estadoDeuda = deudas > 0 ? 
                    `<span class="badge alert">S/ ${deudas.toFixed(2)}</span>` : 
                    `<span class="badge success">Al día</span>`;
                    
                const estadoFaltas = faltas > 0 ? 
                    `<span class="badge alert">${faltas} Faltas</span>` : 
                    `<span class="badge success">Sin faltas</span>`;

                html += `
                    <div class="predio-card">
                        <h3>CÓDIGO: ${p.Código}</h3>
                        <p><span>Bocatoma:</span> <strong>${p.Bocatoma}</strong></p>
                        <p><span>Área:</span> <strong>${p.Área || 0} Ha</strong></p>
                        <p><span>Asistencias:</span> <strong>${p.Asistencias || 0}</strong></p>
                        <p><span>Faltas:</span> ${estadoFaltas}</p>
                        <p><span>Estado de Pagos:</span> ${estadoDeuda}</p>
                    </div>
                `;
            });
        }
        
        resultsDiv.innerHTML = html;
    }
</script>
</body>
</html>
