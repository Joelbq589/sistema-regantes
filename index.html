<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Pumacoccha Huaro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #2c5e3b; --secondary: #3b7b4e; --bg-color: #f0f4f1; --danger: #d9534f; --success: #28a745; --warning: #ffc107; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, button, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--secondary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-admin { background: transparent; color: #888; border: none; text-decoration: underline; font-size: 12px; margin-top: 20px; }
        #reader { width: 100%; display: none; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 350px; }
        .action-btns { display: flex; gap: 5px; margin-top: 10px; }
        .btn-success { background: var(--success); } .btn-warning { background: var(--warning); color: #000; } .btn-danger { background: var(--danger); }
        #adminPanel { display: none; background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sub-Sector Pumacoccha-Huaro</h1>

    <div id="adminPanel">
        <h3 id="adminTitle" style="margin-top:0;"></h3>
        <input type="text" id="idEvento" placeholder="ID Evento (Ej: EV-001)" style="display:none;">
        <div id="adminControls"></div>
        <button style="background: var(--danger);" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div id="reader"></div>

    <input type="text" id="searchInput" placeholder="Ingrese DNI o Catastro...">
    <button onclick="ejecutarBusqueda()">BUSCAR SOCIO</button>
    
    <div id="results" style="margin-top: 20px;"></div>
    
    <button class="btn-admin" onclick="document.getElementById('loginModal').style.display='flex'">Acceso Administrativo</button>
</div>

<!-- Modal Login -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary); margin-top:0;">Login</h2>
        <input type="text" id="usuarioInput" placeholder="Usuario">
        <input type="password" id="passwordInput" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Ingresar</button>
        <button class="btn-danger" onclick="document.getElementById('loginModal').style.display='none'">Cancelar</button>
        <p id="loginMsg" style="text-align:center; color:var(--danger);"></p>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwEA0dPJHtWupjtp7QihhUhmDiyDrJ5sOCvQNpM__M45YI6slb3sSJCmLSsDCPk-tlB6Q/exec"; // REEMPLAZA CON TU ENLACE NUEVO
    let rolActual = "PUBLICO";
    let html5QrcodeScanner;
    let datosPadron = null; // Guardará la DB temporalmente para no saturar internet

    async function iniciarSesion() {
        const user = document.getElementById("usuarioInput").value;
        const pass = document.getElementById("passwordInput").value;
        document.getElementById("loginMsg").innerText = "Validando...";

        const response = await fetch(`${API_URL}?action=login&usuario=${user}&password=${pass}`);
        const data = await response.json();

        if (data.success) {
            rolActual = data.rol;
            document.getElementById("loginModal").style.display = "none";
            activarPanelAdministrativo();
        } else {
            document.getElementById("loginMsg").innerText = data.mensaje;
        }
    }

    function activarPanelAdministrativo() {
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminTitle").innerText = `Rol: ${rolActual}`;
        
        const controls = document.getElementById("adminControls");
        if (rolActual === "TOTAL" || rolActual === "ASISTENCIAS") {
            document.getElementById("idEvento").style.display = "block";
            controls.innerHTML = `<button onclick="iniciarEscaner()">📸 Iniciar Escáner QR/Barras</button>`;
        }
    }

    function cerrarSesion() {
        rolActual = "PUBLICO";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("idEvento").style.display = "none";
        if(html5QrcodeScanner) html5QrcodeScanner.clear();
        document.getElementById("reader").style.display = "none";
    }

    function iniciarEscaner() {
        document.getElementById("reader").style.display = "block";
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: {width: 250, height: 250} },
            (decodedText) => {
                html5QrcodeScanner.stop();
                document.getElementById("reader").style.display = "none";
                document.getElementById("searchInput").value = decodedText;
                ejecutarBusqueda();
            }
        ).catch(err => alert("Error de cámara: " + err));
    }

    async function ejecutarBusqueda() {
        const query = document.getElementById("searchInput").value.trim();
        const results = document.getElementById("results");
        results.innerHTML = "Buscando...";

        if (!datosPadron) {
            const req = await fetch(`${API_URL}?action=consulta`);
            datosPadron = await req.json();
        }

        const socio = datosPadron.socios.find(s => s.DNI == query);
        if (!socio) { results.innerHTML = "<b style='color:red;'>No encontrado</b>"; return; }

        const predios = datosPadron.predios.filter(p => p.DNI_Socio == query);
        let html = `<div style="background:var(--primary);color:white;padding:15px;border-radius:8px;">
            <h3>${socio.Nombre}</h3><p>DNI: ${socio.DNI}</p></div>`;

        predios.forEach(p => {
            html += `<div style="border:1px solid #ddd; padding:15px; margin-top:10px; border-radius:8px;">
                <b>Catastro: ${p.Código}</b><br>
                Bocatoma: ${p.Bocatoma} | Área: ${p.Área} Ha`;

            if (rolActual === "TOTAL" || rolActual === "ASISTENCIAS") {
                html += `<div class="action-btns">
                    <button class="btn-success" onclick="registrarAsistencia('${p.Código}', '${socio.DNI}', 'Asistió')">Asistió</button>
                    <button class="btn-warning" onclick="registrarAsistencia('${p.Código}', '${socio.DNI}', 'Tarde')">Tarde</button>
                    <button class="btn-danger" onclick="registrarAsistencia('${p.Código}', '${socio.DNI}', 'Falta')">Falta</button>
                </div>`;
            }
            if (rolActual === "TOTAL" || rolActual === "CONTADOR") {
                html += `<div style="margin-top:10px; border-top:1px solid #ddd; padding-top:10px;">
                    <input type="number" id="monto-${p.Código}" placeholder="Monto S/" style="width:48%; display:inline-block;">
                    <button onclick="registrarPago('${p.Código}', '${socio.DNI}')" style="width:48%; display:inline-block;">Reg. Pago</button>
                </div>`;
            }
            html += `</div>`;
        });
        results.innerHTML = html;
    }

    async function registrarAsistencia(catastro, dni, estado) {
        const idEvento = document.getElementById("idEvento").value;
        if (!idEvento) return alert("Debe ingresar el ID del Evento (Ej: EV-001) en la parte superior.");
        
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "registrar_asistencia", id_evento: idEvento, dni: dni, catastro: catastro, estado: estado })
        });
        alert(`Asistencia guardada: ${estado}`);
    }

    async function registrarPago(catastro, dni) {
        const monto = document.getElementById(`monto-${catastro}`).value;
        if (!monto) return alert("Ingrese un monto.");
        
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "registrar_pago", catastro: catastro, dni: dni, monto: monto, concepto: "Aporte" })
        });
        alert(`Pago registrado: S/ ${monto}`);
    }
</script>
</body>
</html>
